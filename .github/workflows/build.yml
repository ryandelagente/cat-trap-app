name: Build Android App

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (increase by 1 for every Play upload)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown to users'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Target Android 16 (API 36)
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          echo "--- variables.gradle ---"
          cat android/variables.gradle

      - name: Set version code and name
        run: |
          VC="${{ github.event.inputs.versionCode || '1' }}"
          VN="${{ github.event.inputs.versionName || '1.0.0' }}"
          sed -i "s/versionCode .*/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Inject AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          appid = os.environ.get('ADMOB_APP_ID', '').strip()
          if not appid:
              # Google's official TEST App ID — safe placeholder
              appid = 'ca-app-pub-3940256099942544~3347511713'
              print('WARNING: ADMOB_APP_ID secret not set, using Google TEST App ID')
          path = 'android/app/src/main/AndroidManifest.xml'
          xml = open(path).read()
          meta = ('        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  f'            android:value="{appid}"/>\n')
          if 'gms.ads.APPLICATION_ID' not in xml:
              xml = xml.replace('    </application>', meta + '    </application>')
              open(path, 'w').write(xml)
              print('AdMob App ID injected.')
          else:
              print('AdMob meta-data already present.')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release bundle (AAB) and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks

      - name: Sign the AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "Signing $AAB"
          jarsigner -verbose \
            -keystore /tmp/release.jks \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" && echo "✅ AAB signed and verified"
          mkdir -p out
          cp "$AAB" out/cat-trap-adventure-release.aab

      - name: Collect unsigned outputs (when no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.aab" -exec cp {} out/ \;
          find android/app/build/outputs -name "*.apk" -exec cp {} out/ \;
          echo "⚠️ No KEYSTORE_BASE64 secret set — outputs are UNSIGNED."
          echo "   Unsigned builds cannot be uploaded to Google Play."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cat-trap-android-build
          path: out/
          retention-days: 30
